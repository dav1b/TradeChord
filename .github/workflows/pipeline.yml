name: pipeline

on:
  push:
    paths:
      - 'pipeline/**'
      - 'data/contracts/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'data/contracts/**'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: pipeline/.python-version

      - name: Install
        working-directory: pipeline
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: pipeline
        run: ruff check src tests

      - name: Test (offline)
        working-directory: pipeline
        run: pytest -q

      - name: Large-file guard
        run: |
          big=$(find . -type f -size +20M -not -path './.git/*' -not -path './data/releases/*')
          if [ -n "$big" ]; then echo "Unexpected large files:"; echo "$big"; exit 1; fi

      - name: Verify committed release checksums
        run: |
          shopt -s nullglob
          fail=0
          for d in data/releases/*/; do
            [ -f "${d}checksums.txt" ] || continue
            echo "checking ${d}"
            (cd "$d" && sha256sum -c checksums.txt) || fail=1
          done
          exit $fail
