[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradechord-pipeline"
version = "0.1.0"
description = "Collect World Bank WITS trade data and publish versioned dashboard data releases."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "jsonschema>=4.20",
]

[project.scripts]
tradechord-data = "tradechord_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the package importable from src without relying on the editable install.
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
  "integration: tests that contact the live WITS API (excluded by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
